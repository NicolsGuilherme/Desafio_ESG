name: CI/CD - Cidades ESG Inteligentes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compilar, testar e gerar relatório JaCoCo
        run: bash ./mvnw clean verify -B
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-e-cobertura
          path: |
            target/surefire-reports/
            target/site/jacoco/

  docker-build:
    name: Validar imagem Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem da aplicação
        run: docker build --tag cidades-esg-api:${{ github.sha }} .

  deploy-staging:
    name: Deploy e smoke test - staging
    needs: docker-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Subir ambiente de staging
        run: docker compose -p cidades-esg-staging -f docker-compose.staging.yml up -d --build --wait
      - name: Validar staging
        run: |
          curl --fail --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            http://localhost:8081/actuator/health
          curl --fail --show-error \
            http://localhost:8081/api/v1/dashboard/summary
      - name: Coletar logs em caso de falha
        if: failure()
        run: docker compose -p cidades-esg-staging -f docker-compose.staging.yml logs
      - name: Encerrar staging
        if: always()
        run: docker compose -p cidades-esg-staging -f docker-compose.staging.yml down -v

  deploy-production:
    name: Deploy e smoke test - produção acadêmica
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Subir ambiente de produção
        run: docker compose -p cidades-esg-production -f docker-compose.prod.yml up -d --build --wait
      - name: Validar produção
        run: |
          curl --fail --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            http://localhost:8080/actuator/health
          curl --fail --show-error \
            http://localhost:8080/api/v1/dashboard/summary
      - name: Coletar logs em caso de falha
        if: failure()
        run: docker compose -p cidades-esg-production -f docker-compose.prod.yml logs
      - name: Encerrar produção
        if: always()
        run: docker compose -p cidades-esg-production -f docker-compose.prod.yml down -v
